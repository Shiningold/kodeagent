[project]
name = "kodeagent"
version = "0.1.0"
description = "自构建 AI Agent 框架 —— 核心逻辑自己写，基础设施用成熟库"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "熙晓岚" }]
dependencies = [
    "openai>=1.50.0",
    "anthropic>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pyright>=1.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
tui = [
    "textual>=0.80.0",
]

[project.scripts]
kodeagent = "kodeagent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kodeagent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
